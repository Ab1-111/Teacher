<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ملف الأداء الوظيفي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>/* ======================================================================
   دليل التعديل السريع (للمطوّر)
   - لون/خلفية افتراضية: المتغيّر --ac في CSS (القسم 1) والكائن BG في الجزء 7 من الكود.
   - نص ثابت قابل للتعديل من الواجهة: E('t.مفتاح', 'النص الافتراضي').
   - قسم جديد: أضف دالة في PANES + زرًا في NAV (و RAIL إن أردت) + مصفوفة في seed() وقالبًا في ADD إن كان فيه عناصر.
   - أيقونة جديدة: أضف <symbol id="i-اسم"> في الـsprite ثم زرها في قائمة #icp (data-ico).
   - بعد أي تعديل: افتح الصفحة وجرّب (تعديل/حذف/إضافة/نشر/ملف الموظف) قبل التوزيع.
   ====================================================================== *//* ============ 1) الألوان والمتغيرات — غيّر اللون الرئيسي من هنا ============ */:root{--bg:#0a1330;--panel:rgba(255,255,255,.14);--line:rgba(255,255,255,.28);--tx:#fff;--mut:rgba(255,255,255,.72);--ac:#2f6bff;--acrgb:47,107,255;--ac2:color-mix(in srgb,var(--ac) 65%,#000);--spring:cubic-bezier(.34,1.56,.64,1);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,Tahoma,sans-serif;line-height:1.7}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ============ 2) الهيكل العام (خلفية + شريط علوي + جانبي) ============ */#bg{position:fixed;inset:0;z-index:-1;background-size:cover}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.3))}
.shell{max-width:1260px;margin:0 auto;padding:14px 14px 130px;direction:ltr}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.tools{display:flex;gap:8px}
.pill{display:flex;gap:4px;padding:5px;border-radius:30px;overflow-x:auto;max-width:100%;direction:rtl}
.nav{border:0;background:none;color:#fff;font:inherit;padding:8px 18px;border-radius:26px;cursor:pointer;white-space:nowrap;transition:transform .4s var(--spring),background .3s}
.pill .nav.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 75%,#fff),var(--ac));box-shadow:0 4px 18px rgba(var(--acrgb),.55)}
.rbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);backdrop-filter:blur(12px);flex:none;transition:transform .4s var(--spring)}
.rbtn:hover{transform:scale(1.1)}
.rbtn:active{transform:scale(.92)}
.lay{display:flex;gap:16px;align-items:flex-start}
.rail{display:flex;flex-direction:column;gap:10px;padding:10px 8px;border-radius:30px;position:sticky;top:12px}
.rail .nav{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%}
.rail .nav.on{background:var(--ac);box-shadow:0 4px 16px rgba(var(--acrgb),.6)}
.main{flex:1;min-width:0;direction:rtl}
.pane{display:none}
.pane.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}h2{font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 22px}
.profile{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:7px 16px 7px 10px;border-radius:34px;z-index:7;direction:rtl}
.invite{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:7px 8px 7px 16px;border-radius:34px;z-index:7;direction:rtl}
.profile small,.invite small{display:block;color:var(--mut);font-size:11px;line-height:1.3}
.profile b,.invite b{font-size:14px}
/* ============ 3) الصور (مربعات الرفع) ============ */.slot{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;background:#0a0a0a;border:1px dashed #3a3a3a;border-radius:14px;overflow:hidden;color:var(--mut)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.slot.has span{display:none}
.slot.round{width:32px;height:32px;aspect-ratio:1;border-radius:50%;border:0;background:var(--ac)}
.slot.round span{display:none}
.slot.avatar{aspect-ratio:1;border-radius:50%;max-width:260px;width:100%;margin:auto;border:2px solid var(--ac2);box-shadow:0 0 60px rgba(var(--acrgb),.35)}
.rm,.del{display:none;position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;border:0;border-radius:50%;background:#000c;color:#fff;cursor:pointer;z-index:2}
/* ============ 4) الرئيسية (لوحة زجاجية) ============ */.home{display:grid;grid-template-columns:minmax(300px,430px) 1fr minmax(240px,310px);gap:18px;direction:ltr}
.home>*{direction:rtl}
.col{display:flex;flex-direction:column;gap:14px}
.chips2{display:flex;gap:10px;align-items:center}
.datechip{display:flex;gap:8px;align-items:center;padding:10px 16px;border-radius:30px;font-size:14px}
.panel{border-radius:26px;padding:18px}
.ptitle{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:16px;font-weight:700}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:14px 0;border-top:1px solid rgba(255,255,255,.22)}
.fields small,.mini small,.act small,.arch small{color:var(--mut);font-size:12px;display:block}
.fields b{font-size:15px}
.cta{display:inline-flex;gap:8px;align-items:center;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#7fd0ff));color:#fff;border:0;border-radius:30px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(var(--acrgb),.4)}
.cta.wide{width:100%;justify-content:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{border-radius:22px;padding:14px;position:relative;overflow:hidden;min-height:150px}
.mini small{display:flex;gap:6px;align-items:center}
.big{font-size:30px;display:block;margin:6px 0}
.spark{width:100%;height:40px;color:#9ec0ff}
.link{background:none;border:0;color:#cfe0ff;font:inherit;font-size:13px;cursor:pointer;padding:0}
.mini .slot{position:absolute;inset-inline-start:8px;bottom:8px;width:58px;aspect-ratio:1;border-radius:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.act{display:flex;gap:10px;align-items:center;padding:12px;border-radius:22px;color:#fff;font:inherit;text-align:start;cursor:pointer;transition:transform .45s var(--spring)}
.act:hover{transform:translateY(-4px)}
.act:active{transform:scale(.95)}
.act b{display:block;font-size:14px}
.gap{display:flex;align-items:flex-end;justify-content:center}
.arch{position:relative;border-radius:190px 190px 40px 40px;padding:20px 16px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.arch h2{margin:0;font-size:30px}
.vision{font-size:20px;color:color-mix(in srgb,var(--ac) 55%,#fff)}
.arch .slot.avatar{width:62%;max-width:190px;margin:0 0 8px}
.heart{position:absolute;top:14px;inset-inline-end:14px}
.heart.liked svg{fill:#ff375f;color:#ff375f}
.rstats{display:flex;gap:10px;justify-content:center;margin:12px 0}
.rstat{width:76px;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:11px;gap:1px}
.rstat b{font-size:15px;line-height:1.1}
.rrow{display:flex;gap:12px;justify-content:center}
.rrow .rbtn{width:50px;height:50px}
/* ============ 5) البطاقات والمحاور والقوائم ============ */.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card,.row{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;transition:.25s}
.card:hover,.row:hover{transform:translateY(-4px);border-color:var(--ac2)}
.card h3{margin:10px 0 2px;font-size:17px}
.card p{margin:0 0 12px;color:var(--mut);font-size:14px}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--acrgb),.15);color:var(--ac)}
.meter{height:7px;background:#222;border-radius:9px;overflow:hidden}
.fill{display:block;height:100%;width:0;background:linear-gradient(270deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#fff));border-radius:9px;transition:width 1s ease}
.card small{display:block;margin-top:6px;color:#ccc}
figure{margin:0;position:relative}
figcaption{margin-top:8px;font-size:14px}
.list{display:grid;gap:12px}
.row{display:flex;gap:14px;align-items:center}
.row h3{margin:0;font-size:16px}
.row p{margin:0;color:var(--mut);font-size:13px}
/* ============ 6) التحكم والتعديل ============ */.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;background:#111e;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:30px;padding:7px;z-index:9}
.bar button,.addbtn{display:inline-flex;align-items:center;gap:6px;background:#1b1b1b;color:var(--tx);border:1px solid var(--line);border-radius:30px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.bar button.on{background:var(--ac);border-color:var(--ac)}
.addbtn{display:none;margin-top:14px;border-color:var(--ac)}
.ed .addbtn{display:inline-flex}
.ed .slot{cursor:pointer;border-color:var(--ac)}
.ed .slot img{cursor:pointer}
.ed .slot.has .rm,.ed .del{display:block}
.ed [data-e]{outline:1px dashed rgba(var(--acrgb),.55);outline-offset:3px;cursor:text}
/* ============ 6b) الملفات + التفاعل بأسلوب آبل ============ */.card,.row,.circ,.cta,.bar button,.addbtn,.nav{transition:transform .45s var(--spring),border-color .2s,box-shadow .3s,background .3s}
.cta:active,.bar button:active,.addbtn:active,.nav:active{transform:scale(.94)}
.fgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.folder{position:relative}
.ftile{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:26px;background:rgba(255,255,255,.06);backdrop-filter:blur(14px);border:1px solid var(--line);cursor:pointer;transition:transform .45s var(--spring),border-color .2s}
.ftile:hover{transform:scale(1.05);border-color:var(--ac2)}
.ftile:active{transform:scale(.95)}
.fprev{display:grid;grid-template-columns:1fr 1fr;gap:5px;aspect-ratio:1;padding:8px;border-radius:18px;background:rgba(0,0,0,.4)}
.fprev i{border-radius:8px;background:#ffffff14 center/cover}
.fname{padding:0 4px}
.fcount{color:var(--mut);padding:0 4px;font-size:12px}
.fbody{display:none;position:fixed;inset:0;z-index:8;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 90px;background:rgba(0,0,0,.55);backdrop-filter:blur(14px)}
.folder.open .fbody{display:flex;animation:fade .3s}
.sheet{width:min(780px,100%);max-height:100%;overflow:auto;padding:20px;background:rgba(26,26,26,.94);border:1px solid var(--line);border-radius:30px;animation:pop .55s var(--spring)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fhead h2{margin:0}
.fclose{width:34px;height:34px;border:0;border-radius:50%;background:#2a2a2a;color:#fff;cursor:pointer;display:grid;place-items:center}
.seg{display:flex;gap:4px;background:#0c0c0c;border-radius:30px;padding:4px;margin:14px 0}
.seg button{flex:1;border:0;background:none;color:#bbb;border-radius:26px;padding:8px;font:inherit;cursor:pointer;transition:background .3s,color .3s}
.seg button.on{background:var(--ac);color:#fff}
.tab{display:none}
.tab.on{display:block;animation:in .35s}
.items{display:grid;gap:10px}
.goal{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.goal input{appearance:none;-webkit-appearance:none;flex:none;margin:0;width:24px;height:24px;border-radius:50%;border:2px solid #555;display:grid;place-items:center;cursor:pointer;transition:transform .4s var(--spring),background .3s,border-color .3s}
.goal input:checked{background:var(--ac);border-color:var(--ac);transform:scale(1.12)}
.goal input:checked::after{content:"✓";color:#fff;font-size:14px;line-height:1}
.goal:has(input:checked) span{color:var(--mut);text-decoration:line-through}
.goal .del{top:50%;margin-top:-13px}
#pal{display:none;position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:94%;bottom:calc(74px + env(safe-area-inset-bottom,0px));gap:10px;align-items:center;padding:12px;background:#151515ee;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;z-index:10}
#pal.on{display:flex;animation:pop .4s var(--spring)}
#pal button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .35s var(--spring)}
#pal button.on{border-color:#fff;transform:scale(1.18)}
#cc{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer}
body.lock{overflow:hidden}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
}/* ============ 7) تعديلات الزجاج + الجوال + الطباعة ============ */.gl,.card,.row,.ftile,.goal,.sheet,#pal,#bgp,#toast,.profile,.invite,.bar{background:linear-gradient(145deg,var(--g1),var(--g2));border:1px solid var(--gb);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 12px 40px rgba(8,16,60,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.sheet{background:linear-gradient(145deg,rgba(40,62,130,.8),rgba(18,28,80,.78))}
.fbody{background:rgba(5,10,40,.45)}
.seg{background:rgba(255,255,255,.14)}
.meter{background:rgba(255,255,255,.22)}
.slot{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45)}
.goal input{border-color:rgba(255,255,255,.65)}
.addbtn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4)}
.bar{border-radius:36px;gap:6px;padding:8px}
.bar button{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;background:transparent;border:0;color:#fff}
.bar .i{width:22px;height:22px}
.bar button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 75%,#fff),var(--ac));box-shadow:0 4px 16px rgba(var(--acrgb),.6)}
#pal{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
#bgp{display:none;position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:94%;bottom:calc(86px + env(safe-area-inset-bottom,0px));gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px;border-radius:24px;z-index:10}
#bgp.on{display:flex;animation:pop .4s var(--spring)}
#bgp [data-bg]{width:38px;height:38px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:transform .35s var(--spring)}
#bgp [data-bg].on{border-color:#fff;transform:scale(1.12)}
#bgp .tb{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;margin:0 auto;width:max-content;padding:10px 18px;border-radius:30px;opacity:0;transition:opacity .4s;z-index:30;pointer-events:none}
#toast.on{opacity:1}
.top .slot.round{width:46px;height:46px;background:rgba(255,255,255,.92);border:3px solid rgba(255,255,255,.5)}
.top .slot.round::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#2a3a66}
.top .slot.round.has::after{display:none}
@media(max-width:1000px){.home{grid-template-columns:1fr 1fr}
.gap{display:none}
.invite{display:none}
}@media(max-width:760px){.home{grid-template-columns:1fr}
.arch{order:-1}
.rail,.profile{display:none}
.lay{display:block}
.three{grid-template-columns:1fr}
.shell{padding-inline:10px}
}@media print{*{color:#000!important;backdrop-filter:none!important;box-shadow:none!important}
#bg,.veil,.rail,.top,.profile,.invite,.bar,#pal,#bgp,.addbtn,.del,.rm{display:none!important}
body{background:#fff}
.pane{display:block!important;break-inside:avoid;margin-bottom:24px}
.gl,.card,.row,.ftile,.goal{background:#fff!important;border-color:#bbb!important}
.home{display:block}
}/* ============ 8) المرفقات والرسم البياني والعارض والقوائم ============ */.achips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.att{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:13px;cursor:pointer}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.att .x{display:none;background:none;border:0;color:#fff;cursor:pointer;font-size:15px}
.ed .att .x{display:inline}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.ath{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);cursor:pointer;font-size:11px;word-break:break-all}
.ath img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chart{border-radius:22px;padding:16px;margin-bottom:16px}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bc i{display:block;width:100%;border-radius:8px 8px 3px 3px;min-height:3px;background:linear-gradient(0deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#fff));transition:height .6s var(--spring)}
.bc small{font-size:11px;color:var(--mut)}
.card input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0}
.hint{color:var(--mut);font-size:14px}
#more{display:none;position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:94%;bottom:calc(86px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:4px;padding:8px;border-radius:22px;z-index:10}
#more.on{display:flex;animation:pop .4s var(--spring)}
#more button{display:flex;gap:10px;align-items:center;background:none;border:0;color:#fff;font:inherit;padding:10px 14px;border-radius:14px;cursor:pointer;text-align:start}
#more button:hover{background:rgba(255,255,255,.14)}
.dirty [data-t="pub"]::after{content:"";position:absolute;top:6px;inset-inline-end:6px;width:10px;height:10px;border-radius:50%;background:#ffb020;border:2px solid #222}
.bar button{position:relative}
.ro [data-t="pub"],.ro [data-t="tg"]{display:none}
.tb{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
#vw{display:none;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:16px}
#vw.on{display:flex}
.vbox{width:min(900px,100%);height:min(86vh,100%);display:flex;flex-direction:column;gap:10px}
.vh{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#fff}
#vc{flex:1;min-height:0;display:flex}
#vc img{margin:auto;max-width:100%;max-height:100%;border-radius:12px}
#vc iframe{width:100%;height:100%;border:0;border-radius:12px;background:#fff}
.nopane .pane.on{animation:none!important}
.nosheet .sheet,.nosheet .tab.on{animation:none!important}
/* ============ 9) آيباد/تابلت + الوضع الداكن ============ */:root{--g1:rgba(255,255,255,.22);--g2:rgba(255,255,255,.07);--gb:rgba(255,255,255,.28)}
html[data-theme=dark]{--g1:rgba(255,255,255,.1);--g2:rgba(255,255,255,.03);--gb:rgba(255,255,255,.15);--mut:rgba(255,255,255,.62)}
html[data-theme=dark] .veil{background:linear-gradient(180deg,rgba(2,6,24,.45),rgba(2,6,24,.72))}

<script data-own>
/* ======================================================================
   ملف الأداء الوظيفي — تطبيق مبني على "حالة" (state) تُرسم منها الواجهة
   الأقسام: 1 أدوات | 2 بيانات افتراضية | 3 حفظ ونشر | 4 مكوّنات | 5 الأقسام
            6 الأحداث | 7 الخلفية والألوان | 8 التشغيل
   ====================================================================== */
const SRC = document.documentElement.cloneNode(true);   // نسخة المصدر لاستخدامها عند النشر

/* ---------- 1) أدوات ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ICON = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const isImg = a => a && a.type.startsWith('image/');
let state, ed = false, ui = { tab: 'home', folder: null, ft: 'img', all: false, fxp: true, fxs: false }, upT = null, imgT = null, undoFn = null, reviewing = null, DK = 'draft';
const get = p => p.split('.').reduce((o, k) => o?.[k], state);
const set = (p, v) => { const k = p.split('.'), l = k.pop(); k.reduce((o, x) => o[x] ??= {}, state)[l] = v; };
const readURL = f => new Promise(r => { const d = new FileReader(); d.onload = () => r(d.result); d.readAsDataURL(f); });
const toBlob = u => { const [h, b] = u.split(','), m = h.match(/:(.*?);/)[1], s = atob(b), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return new Blob([a], { type: m }); };
async function resize(file, max) {
  const img = new Image(); img.src = await readURL(file); await img.decode();
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .82);
}
function toast(m, undo) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on'); t.classList.toggle('undo', !!undo); undoFn = undo || null;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), undo ? 5000 : 2200);
}
const snap = () => { const j = JSON.stringify(state); return () => { state = JSON.parse(j); dirty(); applyLook(); render(); }; };

/* ---------- 2) بيانات افتراضية (✏️ عدّل هنا لتغيير القالب) ---------- */
const AXES0 = [
 ['أداء الواجبات الوظيفية', 'الالتزام بالدوام والمهام الموكلة.', 95], ['التفاعل مع المجتمع المهني', 'المشاركة في اللقاءات والمجتمعات المهنية.', 90],
 ['التفاعل مع أولياء الأمور', 'تواصل فعّال ومستمر مع أولياء الأمور.', 88], ['التنويع في استراتيجيات التدريس', 'استراتيجيات تعلم نشطة ومتنوعة.', 92],
 ['تحسين نتائج المتعلمين', 'رفع مستوى التحصيل والمهارات.', 90], ['إعداد وتنفيذ خطة التعلم', 'تخطيط الدروس وفق الأهداف.', 95],
 ['توظيف تقنيات ووسائل التعلم', 'دمج التقنية والوسائل في الدرس.', 88], ['تهيئة البيئة التعليمية', 'بيئة صفية آمنة ومحفزة.', 93],
 ['الإدارة الصفية', 'ضبط الصف وتنظيم الوقت.', 92], ['تحليل نتائج المتعلمين', 'تشخيص المستوى ومعالجة الفاقد.', 89],
 ['تنويع أساليب التقويم', 'تقويم تكويني وختامي متنوع.', 91]];
const IC = (ic, to = '') => ({ id: uid(), ic, to });
const TL = (ic, to, t, s) => ({ id: uid(), ic, to, t, s });
const norm = o => { const x = Object.assign(seed(), o); x.icons = Object.assign(seed().icons, x.icons); return x; };
const seed = () => ({
  v: 1, savedAt: 0, ac: '#2f6bff', bg: 'p:sky', t: {}, img: {}, gallery: [], icons: { top: [IC('star'), IC('book')], arch: [IC('phone', 'contact'), IC('mail', 'contact'), IC('home', 'contact')], tiles: [TL('image', 'evidence', 'الشواهد', 'صور وأعمال'), TL('folder', 'files', 'الملفات', 'صور وأهداف'), TL('award', 'courses', 'الدورات', 'الشهادات')] },
  axes: AXES0.map(([title, desc, pct]) => ({ id: uid(), title, desc, pct, att: [] })),
  folders: [{ id: uid(), name: 'ملف الفصل الأول', images: [], evidence: [{ id: uid(), title: 'عنوان الشاهد', desc: 'وصف مختصر للشاهد', att: [] }], goals: [{ id: uid(), text: 'اكتب هدفك هنا', done: false }] }],
  courses: [{ id: uid(), title: 'اسم الدورة التدريبية', meta: 'الجهة المانحة • 20 ساعة • 1446 هـ', att: [] }],
  contacts: [{ id: uid(), ic: 'phone', title: '05XXXXXXXX', sub: 'الجوال' }, { id: uid(), ic: 'mail', title: 'name@email.com', sub: 'البريد الإلكتروني' }, { id: uid(), ic: 'home', title: 'اسم المدرسة', sub: 'جهة العمل' }]
});
const ADD = {   // ✏️ قوالب العناصر الجديدة (زر "إضافة")
  axes: () => state.axes.push({ id: uid(), title: 'محور جديد', desc: 'وصف مختصر للمحور', pct: 80, att: [] }),
  folders: () => state.folders.push({ id: uid(), name: 'ملف جديد', images: [], evidence: [], goals: [] }),
  courses: () => state.courses.push({ id: uid(), title: 'دورة جديدة', meta: 'الجهة • الساعات • السنة', att: [] }),
  contacts: () => state.contacts.push({ id: uid(), ic: 'star', title: 'بيان جديد', sub: 'وصف' }),
  ev: i => state.folders[i].evidence.push({ id: uid(), title: 'عنوان الشاهد', desc: 'وصف مختصر', att: [] }),
  goal: i => state.folders[i].goals.push({ id: uid(), text: 'اكتب هدفك', done: false })
};

/* ---------- 3) الحفظ المحلي والنشر والتصدير ---------- */
const idb = (m, k, v) => new Promise(res => {
  const t = setTimeout(() => res(null), 1500);
  try {
    const r = indexedDB.open('teacher-file', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { const st = r.result.transaction('kv', m === 'get' ? 'readonly' : 'readwrite').objectStore('kv'), q = m === 'get' ? st.get(k) : st.put(v, k); q.onsuccess = () => { clearTimeout(t); res(q.result); }; q.onerror = () => res(null); };
    r.onerror = () => res(null);
  } catch (e) { res(null); }
});
let tm;
function dirty() { if (reviewing) return; state.savedAt = Date.now(); clearTimeout(tm); tm = setTimeout(() => idb('put', DK, { state }), 500); document.body.classList.add('dirty'); }
function buildDoc(st = state) {
  const c = SRC.cloneNode(true);
  $('#state', c).textContent = JSON.stringify(st).replace(/</g, '\\u003c');
  $$('script', c).forEach(s => { if (s.id !== 'state' && !s.hasAttribute('data-own')) s.remove(); });
  return '<!DOCTYPE html>\n' + c.outerHTML;
}
async function publish() {
  if (state.mode === 'employee') return;
  if (reviewing) return toast('أغلق المراجعة أولًا');
  let art = null; try { art = await window.claude.use('artifact'); } catch (e) {}
  if (!art) return toast('النشر غير متاح في هذا العرض — استخدم «تصدير نسخة احتياطية»');
  state.savedAt = Date.now(); await idb('put', DK, { state });
  const html = buildDoc(); if (html.length > 15.5e6) return toast('الحجم كبير جدًا، احذف بعض المرفقات');
  try { toast('جارٍ النشر…'); await art.publish(html); }
  catch (e) {
    if (e.code === 'not_writer' || e.code === 'not_granted') { document.body.classList.add('ro'); toast('هذا العرض للقراءة فقط'); }
    else if (e.code === 'conflict') toast('نُشرت نسخة أحدث، سيُعاد التحميل');
    else toast('تعذّر النشر (' + (e.code || 'خطأ') + ')');
  }
}
async function saveFile(filename, data) {
  let d = null; try { d = await window.claude.use('downloads'); } catch (e) {}
  if (d) { try { await d.save({ filename, data }); return true; } catch (e) { if (e.code !== 'declined') toast(e.code === 'extension_not_enabled' || e.code === 'rejected_extension' ? 'هذا النوع من الملفات غير متاح للحفظ هنا' : 'تعذّر الحفظ'); return false; } }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename; a.click(); return true; } catch (e) { toast('الحفظ غير متاح هنا'); return false; }
}

/* ---------- 4) مكوّنات الواجهة ---------- */
const E = (p, def, tag = 'span', x = '') => `<${tag} ${ed ? 'contenteditable="true"' : ''} data-e data-p="${p}" ${x}>${esc(get(p) ?? def)}</${tag}>`;
const addBtn = (k, l) => ed ? `<button class="addbtn" data-add="${k}">${ICON('plus')}${l}</button>` : '';
const iconRow = zone => (state.icons[zone] || []).map((c, i) => `<button class="rbtn" data-ic="${zone}.${i}" data-drag="icons.${zone}.${i}" title="${esc(c.to || '')}">${ICON(c.ic)}${ed ? `<span class="icx" data-icdel="${zone}.${i}">−</span>` : ''}</button>`).join('') + (ed ? `<button class="rbtn add" data-icadd="${zone}">${ICON('plus')}</button>` : '');
const tiles = () => (state.icons.tiles || []).map((c, i) => `<div class="gl act" data-tile="${i}" data-drag="icons.tiles.${i}">${ed ? `<span class="icx" data-icdel="tiles.${i}">−</span>` : ''}<span class="ti" data-ic="tiles.${i}">${ICON(c.ic)}</span><span><b>${E(`icons.tiles.${i}.t`, '')}</b>${E(`icons.tiles.${i}.s`, '', 'small')}</span></div>`).join('') + (ed ? `<button class="gl act add" data-icadd="tiles">${ICON('plus')}<span><b>إضافة عنصر</b></span></button>` : '');
const clockHTML = () => `<div class="gl clock"><div class="ckt"><b id="ckT"></b><small id="ckP"></small></div><div class="ckd"><b id="ckW"></b><span id="ckG"></span><small id="ckH"></small></div></div>`;
function tick() { try { tick0(); } catch (e) {} }
function tick0() {   // الساعة واليوم والتاريخ (ميلادي + هجري) حسب جهازك
  const d = new Date(), F = (o, l) => new Intl.DateTimeFormat(l, o), set = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== v) e.textContent = v; };
  const tp = Object.fromEntries(F({ hour: 'numeric', minute: '2-digit', hour12: true }, 'ar-SA-u-nu-latn').formatToParts(d).map(x => [x.type, x.value]));
  set('ckT', tp.hour + ':' + tp.minute); set('ckP', tp.dayPeriod || '');
  set('ckW', F({ weekday: 'long' }, 'ar-SA').format(d));
  set('ckG', F({ day: 'numeric', month: 'long', year: 'numeric' }, 'ar-SA-u-ca-gregory-nu-latn').format(d));
  const hj = F({ day: 'numeric', month: 'long', year: 'numeric' }, 'ar-SA-u-ca-islamic-umalqura-nu-latn');
  set('ckH', hj.resolvedOptions().calendar === 'islamic-umalqura' ? hj.format(d).replace(/\s*هـ$/, '') + ' هـ' : '');
}
const slot = (p, cls = '', ph = 'image') => { const v = get(p); return `<div class="slot ${cls}${v ? ' has' : ''}" data-img="${p}">${v ? `<img src="${v}" alt="">` : `<span>${ICON(ph)}</span>`}${v ? `<button class="rm" data-rmi="${p}">×</button>` : ''}</div>`; };
function atts(p, mode = 'chips') {   // قائمة مرفقات (صور / PDF / شهادات) على مسار p
  const arr = get(p) || [];
  const items = arr.map((a, i) => mode === 'grid'
    ? `<div class="ath" data-view="${p}.${i}">${isImg(a) ? `<img src="${a.data}" alt="">` : ICON('book') + `<small>${esc(a.name)}</small>`}<button class="del" data-del="${p}.${i}">×</button></div>`
    : `<div class="att" data-view="${p}.${i}">${ICON(isImg(a) ? 'image' : 'book')}<span>${esc(a.name)}</span><button class="x" data-del="${p}.${i}">×</button></div>`).join('');
  return `<div class="${mode === 'grid' ? 'agrid' : 'achips'}">${items}${ed ? `<button class="addbtn" data-up="${p}">${ICON('plus')}إرفاق صورة / PDF</button>` : ''}</div>`;
}
const avg = () => Math.round(state.axes.reduce((s, a) => s + (+a.pct || 0), 0) / (state.axes.length || 1));
const spark = () => { const n = state.axes.length; return n < 2 ? '' : 'M' + state.axes.map((a, i) => (i * 120 / (n - 1)).toFixed(1) + ' ' + (38 - Math.max(0, Math.min(1, (a.pct - 60) / 40)) * 34).toFixed(1)).join('L'); };
const chart = () => `<div class="bars">${state.axes.map((a, i) => `<div class="bc" title="${esc(a.title)}"><i style="height:${a.pct}%"></i><small>${i + 1}</small></div>`).join('')}</div>`;

/* ---------- 5) الأقسام ---------- */
const FIELDS = [['الاسم', 't.name', 'الأستاذ / اسم المعلم'], ['التخصص', 't.f1', 'الرياضيات'], ['المرحلة', 't.f2', 'المتوسطة'], ['المدرسة', 't.f3', 'مدرسة ..........'], ['المؤهل', 't.f4', 'بكالوريوس تربية'], ['العام الدراسي', 't.f5', '١٤٤٧ هـ']];
const PANES = {
  home: () => `<div class="home"><div class="col">
   <div class="chips2">${iconRow('top')}<span class="gl datechip">${ICON('calendar')}${E('t.date', 'الفصل الدراسي الأول')}</span></div>
   ${clockHTML()}
   <div class="gl panel"><h3 class="ptitle">${ICON('user')}${E('t.about', 'نبذة عني')}</h3>
    <div class="fields">${FIELDS.map(([l, p, v], i) => `<div>${E('t.fl' + i, l, 'small')}${E(p, v, 'b')}</div>`).join('')}</div>
    <button class="cta wide" data-go="axes">${E('t.cta', 'استعرض محاور الأداء')}${ICON('chev')}</button></div>
   <div class="two">
    <div class="gl mini"><small>${ICON('chart')}${E('t.m1', 'نسبة الإنجاز')}</small><b class="big" id="avgv" data-cnt>${avg()}%</b>${E('t.m1s', 'متوسط أداء المحاور', 'small')}
     <svg class="spark" viewBox="0 0 120 40" preserveAspectRatio="none"><path id="spk" vector-effect="non-scaling-stroke" d="${spark()}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="gl mini"><small>${ICON('award')}${E('t.m2', 'الإنجازات')}</small><b class="big">${E('t.m2v', '٣٠+ دورة')}</b><button class="link" data-go="courses">عرض الكل ›</button>${slot('img.ach')}</div>
   </div>
   <div class="three">${tiles()}</div>
  </div>
  <div class="gl arch"><div class="avw">${slot('img.avatar', 'avatar', 'user')}<button class="rbtn heart" title="أعجبني">${ICON('heart')}</button></div>
   ${E('t.role', 'معلم المرحلة المتوسطة', 'small')}<h2>${E('t.name', 'اسم المعلم')}</h2>${E('t.vl', 'رسالتي', 'small')}<b class="vision">${E('t.vision', 'تعليم يصنع الفرق')}</b>
   <div class="rstats">${[['clock', '12+', 'سنة خبرة'], ['users', '450+', 'طالب'], ['award', '30+', 'دورة']].map(([i, v, l], n) => `<div class="rstat">${ICON(i)}${E('t.s' + n, v, 'b', 'data-cnt')}${E('t.sl' + n, l)}</div>`).join('')}</div>
   <div class="rrow">${iconRow('arch')}</div></div></div>`,

  Object.assign(st, { mode: 'employee', owner: ow, wa: state.wa || '', fid, ac: state.ac, bg: state.bg, bgTone: state.bgTone, credit: `تصميم وتطوير: ${ow || '—'} • رقم النسخة ${fid} • ${date} • جميع الحقوق محفوظة` }); st.t.name = n;

  if (html.length > 15.5e6) return toast('الحجم كبير، استخدم خلفية جاهزة');
  if (await saveFile('teacher-' + safe(n) + '.html', html)) {
    (state.issued ??= []).push({ id: fid, name: n, date }); dirty(); renderIssued();
    $('#empn').value = ''; $('#empp').value = ''; $('#emp').classList.remove('on'); toast('تم إنشاء نسخة ' + n + ' — أرسل الملف له وأعطه كلمة المرور على حدة');
  }
};
function renderIssued() { const l = (state.issued || []).slice().reverse(); $('#empl').innerHTML = `<b>عدد النسخ: ${l.length}</b>` + l.map(x => `<div>${esc(x.name)} • ${esc(x.id)} • ${esc(x.date)}</div>`).join(''); }
$('#revf').onchange = async e => {   // مراجعة ملف موظف (قراءة فقط) دون المساس ببياناتك
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const o = JSON.parse(await f.text()); if (!reviewing) reviewing = { state }; state = norm(o); ed = false; ui.folder = null; document.body.classList.add('rev'); $('#revn').textContent = state.t?.name || 'موظف'; applyTheme(); render(); scrollTo(0, 0); }
  catch (er) { toast('ملف غير صالح'); }
};
$('#revx').onclick = () => { if (!reviewing) return; state = reviewing.state; reviewing = null; document.body.classList.remove('rev'); applyTheme(); render(); };
/* ---------- إعادة الترتيب بالسحب + اهتزاز التعديل (مثل أيقونات آبل) ---------- */
let drag = null, justDragged = false;
document.addEventListener('pointerdown', e => {
  if (!ed || e.target.closest('[data-icdel],[data-e],.del')) return;
  const el = e.target.closest('[data-drag]'); if (el) drag = { el, path: el.dataset.drag, x: e.clientX, y: e.clientY, moved: false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 8) return;
  drag.moved = true; const st = drag.el.style; st.animation = 'none'; st.transition = 'none'; st.zIndex = 30; st.pointerEvents = 'none'; st.transform = `translate(${dx}px,${dy}px) scale(1.12)`;
});
document.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null; if (!d.moved) return;
  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drag]');
  justDragged = true; setTimeout(() => justDragged = false, 120);
  if (t && t !== d.el) {
    const a = d.path.split('.'), b = t.dataset.drag.split('.'), i = +a.pop(), j = +b.pop();
    if (a.join('.') === b.join('.')) { const arr = get(a.join('.')); arr.splice(j, 0, arr.splice(i, 1)[0]); dirty(); }
  }
  render();
});
document.addEventListener('pointercancel', () => { if (drag?.moved) render(); drag = null; });
/* ---------- الأيقونات القابلة للإضافة ---------- */
const TABS = ['home', 'axes', 'evidence', 'files', 'courses', 'contact']; let icT = null;
function openIcp(zone, i) {
  icT = { zone, i }; const c = i >= 0 ? state.icons[zone][i] : null, to = c?.to || '';
  $$('#icp [data-ico]').forEach(b => b.classList.toggle('on', !!c && b.dataset.ico === c.ic));
  $('#icto').value = TABS.includes(to) ? to : ''; $('#icurl').value = TABS.includes(to) ? '' : to; $('#icdel').style.display = i >= 0 ? '' : 'none';
  ['#pal', '#bgp', '#more'].forEach(q => $(q).classList.remove('on')); $('#icp').classList.add('on');
}
function setIconTo() {   // الوجهة: قسم داخلي أو رابط آمن فقط (https / mailto / tel)
  if (!icT || icT.i < 0) return; const u = $('#icurl').value.trim();
  if (u && !/^(https?:|mailto:|tel:)/i.test(u)) return;
  state.icons[icT.zone][icT.i].to = u || $('#icto').value; dirty();
}
function delIcon(path) { const [z, i] = path.split('.'), u = snap(); state.icons[z].splice(+i, 1); icT = null; $('#icp').classList.remove('on'); dirty(); render(); toast('تم الحذف', u); }
function followIcon(c) {
  const to = c?.to || '';
  if (TABS.includes(to)) { ui.tab = to; ui.folder = null; ui.fxp = true; render(); scrollTo(0, 0); }
  else if (/^(https?:|mailto:|tel:)/i.test(to)) window.open(to, '_blank', 'noopener');
}
$('#icp').addEventListener('click', e => {
  const b = e.target.closest('[data-ico]');
  if (b && icT) {
    if (icT.i < 0) { state.icons[icT.zone].push(icT.zone === 'tiles' ? TL(b.dataset.ico, '', 'عنصر جديد', 'وصف مختصر') : IC(b.dataset.ico)); icT.i = state.icons[icT.zone].length - 1; } else state.icons[icT.zone][icT.i].ic = b.dataset.ico;
    setIconTo(); dirty(); render(); $$('#icp [data-ico]').forEach(x => x.classList.toggle('on', x === b));
  }
  if (e.target.closest('#icdel') && icT && icT.i >= 0) delIcon(icT.zone + '.' + icT.i);
  if (e.target.closest('#icok')) $('#icp').classList.remove('on');
});
$('#icto').onchange = setIconTo; $('#icurl').oninput = setIconTo;

/* ---------- 7) الخلفية والألوان ---------- */
const BG = {   // ✏️ أضف خلفية جاهزة هنا ثم أضف زرها في #bgp
  sky: 'radial-gradient(ellipse 60% 40% at 72% 26%,rgba(255,205,150,.6),transparent 60%),radial-gradient(ellipse 90% 28% at 15% 92%,rgba(255,255,255,.6),transparent 70%),radial-gradient(ellipse 70% 30% at 85% 88%,rgba(255,190,170,.55),transparent 70%),linear-gradient(180deg,#2f55a4 0%,#6a8fd0 45%,#c4a6bd 80%,#e8c4ae 100%)',
  sunset: 'radial-gradient(ellipse 70% 40% at 50% 100%,rgba(255,140,60,.8),transparent 70%),linear-gradient(180deg,#1b1646 0%,#7a2f6e 55%,#ff8a4c 100%)',
  night: 'radial-gradient(ellipse 60% 40% at 80% 20%,rgba(120,140,255,.35),transparent 60%),linear-gradient(180deg,#04050d 0%,#0e1536 60%,#2a1f55 100%)',
  forest: 'radial-gradient(ellipse 70% 40% at 30% 100%,rgba(190,255,200,.45),transparent 70%),linear-gradient(170deg,#0a2f26 0%,#1b6b52 60%,#8fd4aa 100%)',
  mono: 'linear-gradient(160deg,#0b0b10,#23232e)',
  lsky: 'radial-gradient(ellipse 60% 40% at 72% 22%,rgba(255,236,200,.8),transparent 60%),radial-gradient(ellipse 90% 30% at 15% 95%,rgba(255,255,255,.9),transparent 70%),linear-gradient(180deg,#a9c9ff 0%,#cfe0ff 45%,#f3e4ee 80%,#ffe8d2 100%)',   // سماء فاتحة للوضع الفاتح
  dsky: 'radial-gradient(ellipse 60% 40% at 72% 20%,rgba(90,120,255,.35),transparent 60%),radial-gradient(ellipse 90% 30% at 15% 95%,rgba(120,90,200,.35),transparent 70%),linear-gradient(180deg,#050a1f 0%,#0b1a45 50%,#1a1840 100%)'   // نسخة السماء للوضع الداكن
};
const TONE = { lsky: 'light', dsky: 'dark', sunset: 'dark', night: 'dark', forest: 'dark', mono: 'dark' };
const toneOf = src => new Promise(r => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d'); x.drawImage(i, 0, 0, 8, 8); const d = x.getImageData(0, 0, 8, 8).data; let L = 0; for (let k = 0; k < d.length; k += 4) L += (0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2]) / 255; r(L / 64 > 0.55 ? 'light' : 'dark'); }; i.onerror = () => r('dark'); i.src = src; });
function applyLook() {
  const v = state.bg || 'p:sky', n = parseInt(state.ac.slice(1), 16), st = document.documentElement.style;
  const key = v === 'p:sky' ? (isDark() ? 'dsky' : 'lsky') : v.slice(2);
  $('#bg').style.background = v.startsWith('i:') ? `url("${v.slice(2)}") center/cover no-repeat` : (BG[key] || BG.sky);
  document.documentElement.dataset.tone = v.startsWith('i:') ? (state.bgTone || 'dark') : (TONE[key] || 'dark');   // لون الخط خارج البطاقات يتبع فاتح/غامق الخلفية
  st.setProperty('--ac', state.ac); st.setProperty('--acrgb', [n >> 16, (n >> 8) & 255, n & 255].join(','));
  $$('#bgp [data-bg]').forEach(b => b.classList.toggle('on', 'p:' + b.dataset.bg === v));
  $$('#pal [data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === state.ac)); $('#cc').value = state.ac;
}
$('#pal').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { state.ac = b.dataset.c; dirty(); applyLook(); } });
$('#cc').oninput = e => { state.ac = e.target.value; dirty(); applyLook(); };
$('#bgp').addEventListener('click', e => {
  const b = e.target.closest('[data-bg]'); if (b) { state.bg = 'p:' + b.dataset.bg; dirty(); applyLook(); }
  if (e.target.closest('#bgup')) $('#bgf').click();
});
$('#bgf').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) { const d = await resize(f, 1800); state.bg = 'i:' + d; state.bgTone = await toneOf(d); dirty(); applyLook(); } };

/* ---------- الوضع: تلقائي / داكن / فاتح (تفضيل خاص بكل مشاهد) ---------- */
const TH = ['auto', 'dark', 'light'], TN = { auto: 'تلقائي (حسب الجهاز)', dark: 'داكن', light: 'فاتح' };
let theme = 'auto'; try { theme = localStorage.getItem('tf-theme') || 'auto'; } catch (e) {}
const isDark = () => theme === 'dark' || (theme === 'auto' && !!window.matchMedia?.('(prefers-color-scheme: dark)').matches);
function applyTheme() {
  document.documentElement.dataset.theme = isDark() ? 'dark' : 'light';
  $$('[data-t="tm"]').forEach(b => b.innerHTML = ICON(themeIcon())); applyLook();
}
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', () => theme === 'auto' && applyTheme());

/* ---------- 8) التشغيل ---------- */
let EMB = {}; try { EMB = JSON.parse($('#state').textContent || '{}'); } catch (e) {}
(async () => {
  DK = EMB.fid ? 'draft:' + EMB.fid : 'draft';
  const dr = await idb('get', DK), useDraft = dr?.state && dr.state.savedAt > (EMB.savedAt || 0);
  state = norm(useDraft ? dr.state : EMB);
  if (useDraft) document.body.classList.add('dirty');
  document.body.classList.toggle('emp', state.mode === 'employee');
  if (state.mode === 'employee') {   // نسخة الموظف: حذف خيارات المالك فعليًا من الصفحة
    $$('[data-act="empcopy"],[data-act="review"],[data-act="discard"],[data-t="pub"]').forEach(e => e.remove()); $('#emp').innerHTML = '';
  }
  applyTheme(); render(); setInterval(tick, 1000);
})();
</script>
